<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ '/tootee-favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>
<body>
  {% include header.html %}
  <main>
    {% unless page.hide_hero %}
    <section class="page-hero">
      {% if page.tag %}<span class="tag">{{ page.tag }}</span>{% endif %}
      <h1>{{ page.headline | default: page.title }}</h1>
      {% if page.intro %}<p>{{ page.intro }}</p>{% endif %}
    </section>
    {% endunless %}
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var header = document.querySelector('header');
      var toggle = document.querySelector('.menu-toggle');
      var nav = document.getElementById('site-nav');
      if (!header || !toggle || !nav) return;

      function setMenu(open) {
        header.classList.toggle('nav-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
      }

      toggle.addEventListener('click', function () {
        setMenu(!header.classList.contains('nav-open'));
      });

      nav.addEventListener('click', function (event) {
        if (event.target.tagName === 'A') setMenu(false);
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') setMenu(false);
      });
    });
  </script>
</body>
</html>
